<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b35">
  <title>Iniciar sesión | Refugio Gestión</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
      color: #202c29;
      background: #f2f4ef;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-columns: minmax(280px, 0.85fr) minmax(360px, 1.15fr);
      background: repeating-linear-gradient(135deg, #f2f4ef 0 28px, #edf1eb 28px 29px);
    }
    .brand {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(32px, 6vw, 80px);
      color: #f5f4e8;
      background: #173b35;
    }
    .mark {
      display: grid;
      width: 48px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid #93b7a1;
      color: #e5c878;
      font-size: 24px;
      font-weight: 700;
    }
    .brand h1 {
      max-width: 440px;
      margin: 0 0 14px;
      font-family: Georgia, serif;
      font-size: clamp(38px, 5vw, 64px);
      font-weight: 400;
      line-height: 1.04;
    }
    .brand p { max-width: 340px; margin: 0; color: #c4d1c8; line-height: 1.6; }
    .brand small { color: #a9beb2; }
    .form-side { display: grid; place-items: center; padding: 32px 24px; }
    .form-wrap { width: min(100%, 390px); }
    .eyebrow {
      margin: 0 0 10px;
      color: #a64f3c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h2 { margin: 0 0 8px; font-size: 28px; }
    .intro { margin: 0 0 30px; color: #5d6964; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; font-size: 14px; font-weight: 600; }
    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #b9c5bd;
      border-radius: 4px;
      background: #fff;
      color: #202c29;
      font: inherit;
    }
    input:focus { border-color: #286656; outline: 3px solid #c5ded1; }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 24px;
      border: 0;
      border-radius: 4px;
      background: #a64f3c;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #873f31; }
    button:disabled { cursor: wait; opacity: 0.7; }
    [role="alert"] { min-height: 24px; margin: 12px 0 0; color: #9a3028; font-size: 14px; }
    @media (max-width: 700px) {
      body { grid-template-columns: 1fr; }
      .brand { min-height: 220px; padding: 28px 24px; }
      .brand h1 { margin-top: 42px; font-size: 38px; }
      .brand p, .brand small { display: none; }
      .form-side { align-items: start; padding-top: 44px; }
    }
  </style>
</head>
<body>
  <aside class="brand">
    <div class="mark" aria-hidden="true">R</div>
    <div>
      <h1>Refugio Gestión</h1>
      <p>Acceso al sistema de administración del refugio.</p>
    </div>
    <small>Acceso protegido</small>
  </aside>
  <main class="form-side">
    <form class="form-wrap" id="login-form">
      <p class="eyebrow">Cuenta del personal</p>
      <h2>Iniciar sesión</h2>
      <p class="intro">Ingresa tus credenciales para continuar.</p>
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit-button" type="submit">Entrar</button>
      <p id="login-error" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector("#login-form");
    const button = document.querySelector("#submit-button");
    const error = document.querySelector("#login-error");

    const params = new URLSearchParams(window.location.search);
    if (params.get("inactivity") === "1") {
      error.textContent = "Tu sesión ha sido cerrada por inactividad.";
    } else if (params.get("expired") === "1") {
      error.textContent = "Tu sesión ha expirado. Por favor, inicia sesión nuevamente.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      error.textContent = "";

      try {
        const response = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: form.elements.email.value,
            password: form.elements.password.value,
          }),
        });
        const result = await response.json();
        if (!response.ok) {
          error.textContent = typeof result.detail === "string"
            ? result.detail
            : "Revisa el formato del correo y vuelve a intentarlo.";
          return;
        }
        window.location.assign(result.redirect_to);
      } catch {
        error.textContent = "No se pudo conectar con el servidor.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
